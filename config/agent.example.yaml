server:
  url: http://central.example.net:8090
agent:
  id: ""
  name: client-win-demo
  location: studio
  role: CLIENT
  token: ""
  profile: DEEP
streams:
  - id: demo
    url: rtmp://stream.example.net:1935/live/demo
monitoring:
  heartbeat_interval: 5
  progress_interval: 1
  freeze_threshold: 2
  silence_threshold: 3
  stall_threshold: 5
  dead_threshold: 15
network:
  enabled: true
  server_host: stream.example.net
  server_port: 1935
# For an SRS SERVER_INGRESS probe, use its loopback read-only HTTP API:
# srs_api:
#   base_url: http://127.0.0.1:1985
#   username: probe-user
#   password: replace-with-secret
state_dir: C:/ProgramData/RtmpMonitor/data
log_dir: C:/ProgramData/RtmpMonitor/logs
