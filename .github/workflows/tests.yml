name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test,windows-service]"
      - name: Run test suite
        run: python -m pytest
      - name: Smoke test Windows service lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $serviceName = 'RtmpMonitorAgent'
          $configDir = Join-Path $env:ProgramData 'RtmpMonitor'
          $configPath = Join-Path $configDir 'agent.yaml'
          $logDir = Join-Path $configDir 'logs\windows-ci'
          $stateDir = Join-Path $configDir 'data\windows-ci'
          $programDir = Join-Path $env:ProgramFiles 'RTMPMonitor-CI'
          $venvDir = Join-Path $programDir '.venv'
          $venvPython = Join-Path $venvDir 'Scripts\python.exe'
          $logPath = Join-Path $logDir 'rtmp-monitor.jsonl'

          if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
            throw "Unexpected pre-existing $serviceName service on the hosted runner."
          }
          if (Test-Path -LiteralPath $programDir) {
            throw "Unexpected pre-existing CI install directory at $programDir."
          }
          if (Test-Path -LiteralPath $configPath) {
            throw "Unexpected pre-existing test config at $configPath."
          }

          $logDirYaml = $logDir.Replace('\', '/')
          $stateDirYaml = $stateDir.Replace('\', '/')
          $testConfig = @"
          server:
            url: http://127.0.0.1:9
          agent:
            name: windows-ci
            location: github-actions
            role: CLIENT
            token: windows-ci-token
            profile: LIGHT
          streams:
            - id: windows-ci
              url: rtmp://127.0.0.1:1935/live/windows-ci
          network:
            enabled: false
          state_dir: '$stateDirYaml'
          log_dir: '$logDirYaml'
          "@

          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          New-Item -ItemType Directory -Force -Path $programDir | Out-Null
          Copy-Item -Recurse -Force (Join-Path (Get-Location) 'src') (Join-Path $programDir 'src')
          Copy-Item -Force (Join-Path (Get-Location) 'pyproject.toml') $programDir
          Set-Content -LiteralPath $configPath -Value $testConfig -Encoding utf8
          try {
            python -m venv $venvDir
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the service test venv.' }
            & $venvPython -m pip install $programDir "pywin32>=306"
            if ($LASTEXITCODE -ne 0) { throw 'Could not install the agent in the service test venv.' }
            python -m win32.scripts.pywin32_postinstall -install -quiet
            if ($LASTEXITCODE -ne 0) { throw 'pywin32 machine-wide post-install setup failed.' }
            & $venvPython -m rtmp_monitor.windows_service_cli --startup auto install
            if ($LASTEXITCODE -ne 0) { throw 'pywin32 service registration failed.' }
            if (-not (Test-Path -LiteralPath (Join-Path $venvDir 'pythonservice.exe'))) {
              throw 'pywin32 did not place pythonservice.exe in the agent venv.'
            }
            & $venvPython -c "from rtmp_monitor.config import load_agent_config; print(load_agent_config(r'$configPath').agent.name)"
            if ($LASTEXITCODE -ne 0) { throw 'The service test YAML is not valid agent configuration.' }
            & sc.exe qc $serviceName
            & reg.exe query "HKLM\SYSTEM\CurrentControlSet\Services\$serviceName" /v ImagePath
            & reg.exe query "HKLM\SYSTEM\CurrentControlSet\Services\$serviceName\PythonClass" /ve
            $serviceHost = Join-Path $venvDir 'pythonservice.exe'
            $debugOut = Join-Path $env:TEMP 'rtmp-service-debug.stdout'
            $debugErr = Join-Path $env:TEMP 'rtmp-service-debug.stderr'
            try {
              $debugProcess = Start-Process -FilePath $serviceHost -ArgumentList @('-debug', $serviceName) -PassThru -WindowStyle Hidden -RedirectStandardOutput $debugOut -RedirectStandardError $debugErr
              if (-not $debugProcess.WaitForExit(5000)) {
                & taskkill.exe /PID $debugProcess.Id /T /F | Out-Null
                $debugProcess.WaitForExit()
              }
              if (Test-Path -LiteralPath $debugOut) { Get-Content -LiteralPath $debugOut -Tail 100 }
              if (Test-Path -LiteralPath $debugErr) { Get-Content -LiteralPath $debugErr -Tail 100 }
            } catch {
              Write-Host "pythonservice debug launch failed: $($_.Exception.Message)"
            }

            Start-Service -Name $serviceName
            $deadline = (Get-Date).AddSeconds(20)
            do {
              $service = Get-Service -Name $serviceName
              if ($service.Status -eq 'Running') { break }
              Start-Sleep -Seconds 1
            } while ((Get-Date) -lt $deadline)
            if ($service.Status -ne 'Running') {
              throw "Service did not reach Running state (current: $($service.Status))."
            }

            $logPath = Join-Path $logDir 'rtmp-monitor.jsonl'
            $deadline = (Get-Date).AddSeconds(15)
            while (-not (Test-Path -LiteralPath $logPath) -and (Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 1
            }
            if (-not (Test-Path -LiteralPath $logPath)) {
              throw 'The Windows service ran without initializing the agent log.'
            }
            Write-Host 'Windows service started and initialized the probe agent.'
          }
          catch {
            $failure = $_
            Write-Host 'Windows service smoke-test diagnostics:'
            Write-Host $failure.Exception.ToString()
            if (Test-Path -LiteralPath $logPath) {
              Get-Content -LiteralPath $logPath -Tail 100
            }
            foreach ($channel in @('Application', 'System')) {
              try {
                Get-WinEvent -FilterHashtable @{ LogName = $channel; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction Stop |
                  Where-Object { $_.ProviderName -match 'Python|RtmpMonitorAgent|Service Control Manager' -or $_.Message -match 'RtmpMonitorAgent|pythonservice|PythonService' } |
                  Select-Object -First 20 TimeCreated, ProviderName, Id, Message |
                  Format-List
              } catch {
                Write-Host "Could not read $channel event log: $($_.Exception.Message)"
              }
            }
            & sc.exe qc $serviceName
            & reg.exe query "HKLM\SYSTEM\CurrentControlSet\Services\$serviceName" /v ImagePath
            & reg.exe query "HKLM\SYSTEM\CurrentControlSet\Services\$serviceName\PythonClass" /ve
            throw
          }
          finally {
            if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
              Stop-Service -Name $serviceName -Force -ErrorAction SilentlyContinue
              $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
              if ($service -and $service.Status -ne 'Stopped') {
                $service.WaitForStatus(
                  [System.ServiceProcess.ServiceControllerStatus]::Stopped,
                  [TimeSpan]::FromSeconds(20)
                )
              }
              & $venvPython -m rtmp_monitor.windows_service_cli remove
              if ($LASTEXITCODE -ne 0) { throw 'Windows service cleanup failed.' }
            }
          }
