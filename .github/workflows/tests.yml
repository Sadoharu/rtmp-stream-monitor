name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-agent-package:
    name: Ubuntu 22.04 agent package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Build self-contained Python wheelhouse package
        run: bash scripts/build-agent-deb.sh "$RUNNER_TEMP/agent-deb"
      - name: Inspect Debian package metadata
        run: |
          dpkg-deb --info "$RUNNER_TEMP"/agent-deb/*.deb
          (cd "$RUNNER_TEMP/agent-deb" && sha256sum --check *.deb.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-22.04-agent-package
          path: ${{ runner.temp }}/agent-deb/*
          if-no-files-found: error

  windows-agent-package:
    name: Build bundled Windows agent package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build Windows bundle with private Python runtime
        shell: powershell
        run: .\scripts\build-windows-agent.ps1 -OutputDirectory "$env:RUNNER_TEMP\windows-agent"
      - name: Verify package checksum
        shell: powershell
        run: |
          $expected = ((Get-Content -Raw "$env:RUNNER_TEMP\windows-agent\rtmp-monitor-agent-windows.zip.sha256").Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP\windows-agent\rtmp-monitor-agent-windows.zip").Hash.ToLowerInvariant()
          if ($expected -notmatch '^[0-9a-f]{64}$' -or $actual -ne $expected) { throw 'Windows package checksum validation failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-agent-package
          path: ${{ runner.temp }}/windows-agent/*
          if-no-files-found: error

  windows-bundled-installer:
    name: Windows bundled service install / uninstall
    runs-on: windows-latest
    needs: windows-agent-package
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: windows-agent-package
          path: ${{ runner.temp }}/windows-agent
      - name: Run bundled installer without system Python
        shell: powershell
        run: .\tests\smoke_windows_installer.ps1 -BundlePath "$env:RUNNER_TEMP\windows-agent\rtmp-monitor-agent-windows.zip"

  frontend:
    name: Dashboard frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build dashboard
        working-directory: frontend
        run: |
          npm run typecheck
          npm run build
      - name: Verify packaged dashboard assets are current
        run: git diff --exit-code -- src/rtmp_monitor/static

  windows-installer:
    name: Windows production installer / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run production Windows installer
        shell: powershell
        run: .\tests\smoke_windows_installer.ps1

  pytest:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test,windows-service]"
      - name: Check Ubuntu installer shell syntax
        if: runner.os == 'Linux'
        run: bash -n install.sh install-server.sh install-agent.sh
      - name: Run test suite
        run: python -m pytest
      - name: Test Windows Python discovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tests\test_windows_python_discovery.ps1
      - name: Smoke test Windows service lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $serviceName = 'RtmpMonitorAgent'
          $configDir = Join-Path $env:ProgramData 'RtmpMonitor'
          $configPath = Join-Path $configDir 'agent.yaml'
          $logDir = Join-Path $configDir 'logs\windows-ci'
          $stateDir = Join-Path $configDir 'data\windows-ci'
          $programDir = Join-Path $env:ProgramFiles 'RTMPMonitor-CI'
          $pythonExe = (Get-Command python).Source
          $pythonPrefix = (& $pythonExe -c "import sys; print(sys.prefix)").Trim()
          $logPath = Join-Path $logDir 'rtmp-monitor.jsonl'

          if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
            throw "Unexpected pre-existing $serviceName service on the hosted runner."
          }
          if (Test-Path -LiteralPath $programDir) {
            throw "Unexpected pre-existing CI install directory at $programDir."
          }
          if (Test-Path -LiteralPath $configPath) {
            throw "Unexpected pre-existing test config at $configPath."
          }

          $logDirYaml = $logDir.Replace('\', '/')
          $stateDirYaml = $stateDir.Replace('\', '/')
          $testConfig = @"
          server:
            url: http://127.0.0.1:9
          agent:
            name: windows-ci
            location: github-actions
            role: CLIENT
            token: windows-ci-token
            profile: LIGHT
          streams:
            - id: windows-ci
              url: rtmp://127.0.0.1:1935/live/windows-ci
          network:
            enabled: false
          state_dir: '$stateDirYaml'
          log_dir: '$logDirYaml'
          "@

          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          New-Item -ItemType Directory -Force -Path $programDir | Out-Null
          Copy-Item -Recurse -Force (Join-Path (Get-Location) 'src') (Join-Path $programDir 'src')
          Copy-Item -Force (Join-Path (Get-Location) 'pyproject.toml') $programDir
          Set-Content -LiteralPath $configPath -Value $testConfig -Encoding utf8
          try {
            & $pythonExe -m pip uninstall -y rtmp-stream-monitor
            if ($LASTEXITCODE -ne 0) { throw 'Could not remove the editable test installation.' }
            & $pythonExe -m pip install --upgrade $programDir "pywin32>=306"
            if ($LASTEXITCODE -ne 0) { throw 'Could not install the agent and pywin32 machine-wide.' }
            & $pythonExe -m win32.scripts.pywin32_postinstall -install -quiet
            if ($LASTEXITCODE -ne 0) { throw 'pywin32 machine-wide post-install setup failed.' }
            & $pythonExe -m rtmp_monitor.windows_service_cli --startup auto install
            if ($LASTEXITCODE -ne 0) { throw 'pywin32 service registration failed.' }
            if (-not (Test-Path -LiteralPath (Join-Path $pythonPrefix 'pythonservice.exe'))) {
              throw 'pywin32 did not place pythonservice.exe beside the machine-wide Python interpreter.'
            }
            & $pythonExe -c "from rtmp_monitor.config import load_agent_config; print(load_agent_config(r'$configPath').agent.name)"
            if ($LASTEXITCODE -ne 0) { throw 'The service test YAML is not valid agent configuration.' }
            & sc.exe qc $serviceName
            & reg.exe query "HKLM\SYSTEM\CurrentControlSet\Services\$serviceName" /v ImagePath
            & reg.exe query "HKLM\SYSTEM\CurrentControlSet\Services\$serviceName\PythonClass" /ve
            $debugOut = Join-Path $env:TEMP 'rtmp-service-debug.stdout'
            $debugErr = Join-Path $env:TEMP 'rtmp-service-debug.stderr'
            try {
              $debugProcess = Start-Process -FilePath (Join-Path $pythonPrefix 'pythonservice.exe') -ArgumentList @('-debug', $serviceName) -PassThru -WindowStyle Hidden -RedirectStandardOutput $debugOut -RedirectStandardError $debugErr
              if (-not $debugProcess.WaitForExit(10000)) {
                & taskkill.exe /PID $debugProcess.Id /T /F | Out-Null
                $debugProcess.WaitForExit()
              }
              if (Test-Path -LiteralPath $debugOut) { Get-Content -LiteralPath $debugOut -Tail 80 }
              if (Test-Path -LiteralPath $debugErr) { Get-Content -LiteralPath $debugErr -Tail 80 }
            } catch {
              Write-Host "pythonservice debug launch failed: $($_.Exception.Message)"
            }

            Start-Service -Name $serviceName
            $deadline = (Get-Date).AddSeconds(20)
            do {
              $service = Get-Service -Name $serviceName
              if ($service.Status -eq 'Running') { break }
              Start-Sleep -Seconds 1
            } while ((Get-Date) -lt $deadline)
            if ($service.Status -ne 'Running') {
              throw "Service did not reach Running state (current: $($service.Status))."
            }

            $logPath = Join-Path $logDir 'rtmp-monitor.jsonl'
            $deadline = (Get-Date).AddSeconds(15)
            while (-not (Test-Path -LiteralPath $logPath) -and (Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 1
            }
            if (-not (Test-Path -LiteralPath $logPath)) {
              throw 'The Windows service ran without initializing the agent log.'
            }
            Write-Host 'Windows service started and initialized the probe agent.'
          }
          catch {
            $failure = $_
            Write-Host 'Windows service smoke-test diagnostics:'
            Write-Host $failure.Exception.ToString()
            if (Test-Path -LiteralPath $logPath) {
              Get-Content -LiteralPath $logPath -Tail 100
            }
            $eventQueries = @(
              @{ LogName = 'Application'; Id = @(14); StartTime = (Get-Date).AddMinutes(-5) },
              @{ LogName = 'System'; ProviderName = 'Service Control Manager'; Id = @(7000, 7009, 7011, 7023, 7024, 7031, 7034); StartTime = (Get-Date).AddMinutes(-5) }
            )
            foreach ($query in $eventQueries) {
              try {
                $events = @(Get-WinEvent -FilterHashtable $query -MaxEvents 100 -ErrorAction Stop)
                Write-Host "Found $($events.Count) matching $($query.LogName) events."
                foreach ($event in $events) {
                  $eventXml = $event.ToXml()
                  Write-Host "Event $($query.LogName) $($event.TimeCreated) $($event.ProviderName) ID $($event.Id)"
                  Write-Host $eventXml
                }
              } catch {
                Write-Host "Could not query $($query.LogName) event log: $($_.Exception.Message)"
              }
            }
            & sc.exe queryex $serviceName
            & sc.exe qc $serviceName
            & reg.exe query "HKLM\SYSTEM\CurrentControlSet\Services\$serviceName" /v ImagePath
            & reg.exe query "HKLM\SYSTEM\CurrentControlSet\Services\$serviceName\PythonClass" /ve
            throw
          }
          finally {
            if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
              Stop-Service -Name $serviceName -Force -ErrorAction SilentlyContinue
              $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
              if ($service -and $service.Status -ne 'Stopped') {
                $service.WaitForStatus(
                  [System.ServiceProcess.ServiceControllerStatus]::Stopped,
                  [TimeSpan]::FromSeconds(20)
                )
              }
              & $pythonExe -m rtmp_monitor.windows_service_cli remove
              if ($LASTEXITCODE -ne 0) { throw 'Windows service cleanup failed.' }
            }
          }
